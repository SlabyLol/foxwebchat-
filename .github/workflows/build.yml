name: Build FoxWebChat

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitarm:latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: |
          make clean
          make -j$(nproc)

      - uses: actions/upload-artifact@v4
        with:
          name: FoxWebChat
          path: |
            *.3dsx
            *.cia
            *.elf
            *.3ds
