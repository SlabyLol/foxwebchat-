name: Build 3DSX

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup devkitPro Environment
        uses: devkitPro/actions/setup@v1
        with:
          packages: 3ds-dev 3ds-tools 3ds-curl 3ds-zlib 3ds-mbedtls

      - name: Compile 3DSX Target
        run: |
          make 3dsx -j$(nproc)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foxwebchat-3dsx-build
          path: |
            *.3dsx
