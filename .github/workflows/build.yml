name: Build Nintendo 3DS CIA

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Build BannerTool
      continue-on-error: true
      run: |
        git clone https://github.com/carstene1ns/3ds-bannertool.git
        cd 3ds-bannertool
        cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
        cmake --build build
        cmake --install build
        cd .. && rm -rf 3ds-bannertool

    - name: Build Makerom
      continue-on-error: true
      run: |
        git clone --recursive https://github.com/3DSGuy/Project_CTR
        cd Project_CTR/makerom
        make deps
        make
        cp ./bin/makerom /usr/local/bin/makerom
        chmod +x /usr/local/bin/makerom
        cd ../.. && rm -rf Project_CTR

    - name: Install 3DS Dependencies & Build CIA
      continue-on-error: true
      working-directory: .
      run: | 
        dkp-pacman -Sy --noconfirm --backend curl || dkp-pacman -Sy --noconfirm
        dkp-pacman -S --noconfirm 3ds-curl 3ds-mbedtls 3ds-libpng 3dstools tex3ds || true
        make cia

    - name: Upload CIA
      uses: actions/upload-artifact@v4
      with:
          name: FoxWebChat
          path: | 
            ./*.cia
            ./*.3dsx
