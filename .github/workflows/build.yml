name: Build 3DSX

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install libctru and 3ds_rules from source
        run: |
          rm -rf /opt/devkitpro/libctru
          git clone https://github.com/devkitPro/libctru.git /opt/devkitpro/libctru
          cd /opt/devkitpro/libctru
          make
          make install

      - name: Compile 3DSX Target
        run: |
          make 3dsx -j$(nproc)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foxwebchat-3dsx-build
          path: |
            *.3dsx
