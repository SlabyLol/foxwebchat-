name: Build and Release FoxWebChat 3DSX

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Project (.3dsx)
        shell: bash
        run: |
          source /etc/profile.d/devkit-env.sh
          make

      - name: Upload 3DSX Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoxWebChat-3DSX-Build
          path: FoxWebChat.3dsx

      - name: Create or Update GitHub Release
        if: github.event_name == 'push'
        uses: softprops/action-gh-release@v2
        with:
          files: FoxWebChat.3dsx
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'latest' }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('FoxWebChat 3DSX {0}', github.ref_name) || 'FoxWebChat 3DSX (Latest Build)' }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
