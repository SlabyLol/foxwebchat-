name: Build 3DSX

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install required devkitPro packages (curl, mbedtls, zlib, tools)
        run: |
          export DEVKITPRO=/opt/devkitpro
          export PATH=$DEVKITPRO/tools/bin:$PATH
          dkp-pacman -Sy --noconfirm 3ds-curl 3ds-mbedtls 3ds-zlib 3dstools general-tools

      - name: Build and Install libctru from source
        run: |
          rm -rf /opt/devkitpro/libctru
          git clone https://github.com/devkitPro/libctru.git /opt/devkitpro/libctru
          cd /opt/devkitpro/libctru && make -j$(nproc) && make install

      - name: Compile 3DSX Target
        run: |
          export DEVKITPRO=/opt/devkitpro
          export DEVKITARM=$DEVKITPRO/devkitARM
          export PATH=$DEVKITPRO/tools/bin:$PATH
          make 3dsx -j$(nproc)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foxwebchat-3dsx-build
          path: |
            *.3dsx
