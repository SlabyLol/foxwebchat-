name: Build FoxWebChat

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    container:
      image: devkitpro/devkitpro:latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update package database
        run: |
          dkp-pacman -Syu --noconfirm

      - name: Install 3DS toolchain
        run: |
          dkp-pacman -S --noconfirm \
            devkitARM \
            libctru \
            citro2d \
            citro3d \
            3ds-portlibs

      - name: Show environment
        run: |
          echo "DEVKITPRO=$DEVKITPRO"
          echo "DEVKITARM=$DEVKITARM"
          ls -la $DEVKITPRO

      - name: Build
        run: |
          make clean
          make -j$(nproc)

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FoxWebChat
          if-no-files-found: warn
          path: |
            *.3dsx
            *.cia
            *.elf
            *.3ds
            *.smdh
            build/**/*.3dsx
            build/**/*.cia
            build/**/*.elf
