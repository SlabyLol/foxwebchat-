name: Build Nintendo 3DS CIA

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build BannerTool
        run: |
          git clone https://github.com/carstene1ns/3ds-bannertool.git
          cd 3ds-bannertool
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
          cmake --install build
          cd .. && rm -rf 3ds-bannertool

      - name: Build Makerom
        run: |
          git clone --recursive https://github.com/3DSGuy/Project_CTR
          cd Project_CTR/makerom
          make deps
          make
          cp ./bin/makerom /usr/local/bin/makerom
          chmod +x /usr/local/bin/makerom
          cd ../.. && rm -rf Project_CTR

      - name: Configure Pacman & Install 3DS SDK
        run: |
          set -e
          PACCONF="/opt/devkitpro/pacman/etc/pacman.conf"

          # 1. Alle alten/widersprüchlichen SigLevel-Zeilen komplett entfernen
          sed -i '/SigLevel/d' "$PACCONF"

          # 2. SigLevel = Never global in [options] erzwingen
          sed -i '/\[options\]/a SigLevel = Never\nLocalFileSigLevel = Never' "$PACCONF"

          # 3. Datenbanken synchronisieren & 3DS SDK + libctru installieren
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --noconfirm 3ds-dev 3ds-curl 3ds-mbedtls 3ds-libpng 3dstools tex3ds

          # 4. Verifizieren, dass 3ds.h wirklich auf der Festplatte gelandet ist
          if [ ! -f /opt/devkitpro/libctru/include/3ds.h ]; then
            echo "FEHLER: libctru/include/3ds.h wurde nicht installiert!"
            exit 1
          fi

      - name: Build App
        run: |
          . /etc/profile.d/devkit-env.sh
          make cia DEVKITPRO=/opt/devkitpro DEVKITARM=/opt/devkitpro/devkitARM

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FoxWebChat
          path: |
            *.cia
            *.3dsx
            build/*.cia
            build/*.3dsx
