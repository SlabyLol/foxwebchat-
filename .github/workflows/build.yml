name: Build Nintendo 3DS CIA

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm

    env:
      DEVKITPRO: /opt/devkitpro
      DEVKITARM: /opt/devkitpro/devkitARM

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build BannerTool
        run: |
          git clone https://github.com/carstene1ns/3ds-bannertool.git
          cd 3ds-bannertool
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
          cmake --install build
          cd .. && rm -rf 3ds-bannertool

      - name: Build Makerom
        run: |
          git clone --recursive https://github.com/3DSGuy/Project_CTR
          cd Project_CTR/makerom
          make deps
          make
          cp ./bin/makerom /usr/local/bin/makerom
          chmod +x /usr/local/bin/makerom
          cd ../.. && rm -rf Project_CTR

      - name: Configure Pacman & Install 3DS SDK
        run: |
          PACCONF="/opt/devkitpro/pacman/etc/pacman.conf"

          # 1. Signaturen deaktivieren
          sed -i 's/SigLevel.*/SigLevel = Never/g' "$PACCONF"
          sed -i 's/LocalFileSigLevel.*/LocalFileSigLevel = Never/g' "$PACCONF"

          # 2. XferCommand injizieren, um Cloudflare 403-Sperren von Pacman zu umgehen
          if ! grep -q "XferCommand" "$PACCONF"; then
            sed -i '/\[options\]/a XferCommand = /usr/bin/curl -A "Mozilla/5.0" -L -C - -f -s -o %o %u' "$PACCONF"
          fi

          # 3. Pacman-Datenbanken synchronisieren und 3DS-Entwicklungspakete sicher installieren
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --noconfirm 3ds-dev 3ds-curl 3ds-mbedtls 3ds-libpng 3dstools tex3ds

      - name: Build App
        run: |
          . /etc/profile.d/devkit-env.sh
          make cia

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FoxWebChat
          path: |
            *.cia
            *.3dsx
            build/*.cia
            build/*.3dsx
