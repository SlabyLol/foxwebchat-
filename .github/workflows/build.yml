name: Build Nintendo 3DS CIA

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build BannerTool
        run: |
          git clone https://github.com/carstene1ns/3ds-bannertool.git
          cd 3ds-bannertool
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
          cmake --install build
          cd .. && rm -rf 3ds-bannertool

      - name: Build Makerom
        run: |
          git clone --recursive https://github.com/3DSGuy/Project_CTR
          cd Project_CTR/makerom
          make deps
          make
          cp ./bin/makerom /usr/local/bin/makerom
          chmod +x /usr/local/bin/makerom
          cd ../.. && rm -rf Project_CTR

      - name: Bypass 403 & Force Disable Signatures
        run: |
          # 1. Signaturprüfung in JEDER pacman.conf deaktivieren (System & DevkitPro)
          find / -name "pacman.conf" -exec sed -i 's/SigLevel.*/SigLevel = Never/g' {} + || true
          find / -name "pacman.conf" -exec sed -i 's/LocalFileSigLevel.*/LocalFileSigLevel = Never/g' {} + || true

          # 2. Sync-Verzeichnis vorbereiten und Datenbanken via curl spiegeln
          mkdir -p /opt/devkitpro/pacman/var/lib/pacman/sync/
          curl -A "Mozilla/5.0" -L -o /opt/devkitpro/pacman/var/lib/pacman/sync/dkp-libs.db https://pkg.devkitpro.org/dkp-libs.db
          curl -A "Mozilla/5.0" -L -o /opt/devkitpro/pacman/var/lib/pacman/sync/dkp-linux.db https://pkg.devkitpro.org/dkp-linux.db

          # 3. Pakete ohne Sync und ohne Signaturprüfung installieren
          dkp-pacman -S --noconfirm --siglevel Never 3ds-curl 3ds-mbedtls 3ds-libpng 3dstools tex3ds

      - name: Build App
        run: |
          make cia

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FoxWebChat
          path: |
            *.cia
            *.3dsx
            build/*.cia
            build/*.3dsx
