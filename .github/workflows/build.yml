name: Build Nintendo 3DS CIA

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build BannerTool
        run: |
          git clone https://github.com/carstene1ns/3ds-bannertool.git
          cd 3ds-bannertool
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
          cmake --install build
          cd .. && rm -rf 3ds-bannertool

      - name: Build Makerom
        run: |
          git clone --recursive https://github.com/3DSGuy/Project_CTR
          cd Project_CTR/makerom
          make deps
          make
          cp ./bin/makerom /usr/local/bin/makerom
          chmod +x /usr/local/bin/makerom
          cd ../.. && rm -rf Project_CTR

      - name: Force Disable PGP Verification & Inject Databases
        run: |
          PACCONF="/opt/devkitpro/pacman/etc/pacman.conf"

          # 1. Ersetze die SigLevel-Zeilen global auf 'Never'
          sed -i 's/SigLevel.*/SigLevel = Never/g' "$PACCONF"
          sed -i 's/LocalFileSigLevel.*/LocalFileSigLevel = Never/g' "$PACCONF"

          # 2. Entferne eventuell verbliebene SigLevel-Einträge in Repositories
          sed -i '/SigLevel/d' "$PACCONF"

          # 3. Setze SigLevel = Never ganz oben in den [options]
          sed -i '/\[options\]/a SigLevel = Never\nLocalFileSigLevel = Never' "$PACCONF"

          # 4. Sync-Ordner anlegen & Datenbanken spiegeln
          mkdir -p /opt/devkitpro/pacman/var/lib/pacman/sync/
          curl -A "Mozilla/5.0" -L -o /opt/devkitpro/pacman/var/lib/pacman/sync/dkp-libs.db https://pkg.devkitpro.org/dkp-libs.db
          curl -A "Mozilla/5.0" -L -o /opt/devkitpro/pacman/var/lib/pacman/sync/dkp-linux.db https://pkg.devkitpro.org/dkp-linux.db

          # 5. Pakete ohne Sync (-Sy) installieren
          dkp-pacman -S --noconfirm 3ds-curl 3ds-mbedtls 3ds-libpng 3dstools tex3ds

      - name: Build App
        run: |
          make cia

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FoxWebChat
          path: |
            *.cia
            *.3dsx
            build/*.cia
            build/*.3dsx
