name: Build FoxWebChat 3DSX

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install 3DS Dependencies
        run: |
          dkp-pacman -Sy --noconfirm 3ds-dev 3ds-curl 3ds-mbedtls

      - name: Build Project (.3dsx)
        shell: bash
        run: |
          . /etc/profile.d/devkit-env.sh
          make

      - name: Upload 3DSX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoxWebChat-3DSX-Build
          path: |
            *.3dsx
