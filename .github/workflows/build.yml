name: Build Nintendo 3DS CIA & 3DSX

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup devkitPRO
        uses: devkitPro/setup-devkitpro@v1
        with:
          3ds: true

      - name: Install dependencies & Tools
        run: |
          sudo dkp-pacman -Sy --noconfirm 3ds-curl 3ds-mbedtls 3ds-libpng 3dstools tex3ds

      - name: Build Bannertool
        run: |
          git clone https://github.com/carstene1ns/3ds-bannertool.git
          cd 3ds-bannertool
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
          sudo cmake --install build
          cd .. && rm -rf 3ds-bannertool

      - name: Build Makerom
        run: |
          git clone --recursive https://github.com/3DSGuy/Project_CTR
          cd Project_CTR/makerom
          make deps
          make
          sudo cp ./bin/makerom /usr/local/bin/makerom
          sudo chmod +x /usr/local/bin/makerom
          cd ../.. && rm -rf Project_CTR

      - name: Build App (3DSX & CIA)
        run: |
          source /etc/profile.d/devkit-env.sh
          make cia

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FoxWebChat-3DS
          path: |
            *.cia
            *.3dsx
