name: Build Nintendo 3DS CIA
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    container:
      image: devkitpro/devkitarm
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Build BannerTool
      run: |
        git clone https://github.com/carstene1ns/3ds-bannertool.git
        cd 3ds-bannertool
        cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
        cmake --build build
        cmake --install build

    - name: Build Makerom
      run: |
        git clone --recursive https://github.com/3DSGuy/Project_CTR
        cd Project_CTR/makerom
        make deps
        make
        cp ./bin/makerom /usr/local/bin/makerom
        chmod +x /usr/local/bin/makerom

    - name: Build 3DSX and CIA
      run: |
        make 3dsx
        make cia

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
          name: FoxWebChat
          path: |
            ./*.cia
            ./*.3dsx

    - name: Create/update GitHub Release
      if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: "Nightly Build"
        prerelease: false
        body: "Automatic Build Release"
        files: |
          ./*.cia
          ./*.3dsx
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
