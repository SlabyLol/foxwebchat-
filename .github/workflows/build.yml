name: Build 3DSX

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install 3DS Dependencies
        run: |
          dkp-pacman -Sy --noconfirm 3ds-dev 3ds-tools 3ds-curl 3ds-zlib 3ds-mbedtls || true

      - name: Compile 3DSX Target
        run: |
          make 3dsx -j$(nproc)

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foxwebchat-3dsx-build
          path: |
            *.3dsx
