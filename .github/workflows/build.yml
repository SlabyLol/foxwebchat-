name: FoxWebChat 3DSX Build

on:
  push:
    branches: [ "main", "master", "dev" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-3dsx:
    name: Build FoxWebChat .3dsx
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm
      options: --user 1001

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: 3DS Bibliotheken installieren (3ds-dev)
        run: |
          dkp-pacman -Syu --noconfirm 3ds-dev

      - name: .3dsx kompilieren
        run: make -j$(nproc --all)

      - name: .3dsx Artefakt hochladen
        uses: actions/upload-artifact@v4
        with:
          name: foxwebchat-3dsx
          path: "*.3dsx"
