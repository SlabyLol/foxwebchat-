name: Build and Release FoxWebChat 3DSX

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install 3DS Dependencies
        run: |
          dkp-pacman -Sy --noconfirm 3ds-dev 3ds-curl 3ds-mbedtls

      - name: Build Project (.3dsx)
        shell: bash
        run: |
          . /etc/profile.d/devkit-env.sh
          make

      - name: Upload 3DSX Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FoxWebChat-3DSX-Build
          path: FoxWebChat.3dsx

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: FoxWebChat.3dsx
          name: FoxWebChat 3DSX ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
