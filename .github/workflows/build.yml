name: Build 3DS CIA & 3DSX

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm:latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Compile ELF
        run: |
          make -j$(nproc)

      - name: Package with bannertool and makerom
        run: |
          # 1. SMDH (Icon) generieren falls icon.png existiert, sonst Text-Fallback
          if [ -f icon.png ]; then
            bannertool makesmdh -s "FoxWebChat" -l "FoxWebChat" -p "DarkFox Co." -i icon.png -o icon.bin
          else
            bannertool makesmdh -s "FoxWebChat" -l "FoxWebChat" -p "DarkFox Co." -o icon.bin
          fi

          # 2. CIA bauen mit makerom
          makerom -v -f cia -o foxwebchat.cia -exefslogo -elf foxwebchat.elf -icon icon.bin

          # 3. 3DSX bauen
          3dsxtool foxwebchat.elf foxwebchat.3dsx --smdh=icon.bin

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: foxwebchat-3ds-build
          path: |
            *.cia
            *.3dsx
