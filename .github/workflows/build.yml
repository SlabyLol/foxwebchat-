name: Build Nintendo 3DS CIA

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkitarm
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Build BannerTool
        run: |
          git clone https://github.com/carstene1ns/3ds-bannertool.git
          cd 3ds-bannertool
          cmake -B build -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build
          cmake --install build
          cd .. && rm -rf 3ds-bannertool

      - name: Build Makerom
        run: |
          git clone --recursive https://github.com/3DSGuy/Project_CTR
          cd Project_CTR/makerom
          make deps
          make
          cp ./bin/makerom /usr/local/bin/makerom
          chmod +x /usr/local/bin/makerom
          cd ../.. && rm -rf Project_CTR

      - name: Fix Pacman Database & Install Dependencies
        run: |
          PACCONF="/opt/devkitpro/pacman/etc/pacman.conf"

          # 1. Signaturprüfungen im Container deaktivieren
          sed -i 's/SigLevel.*/SigLevel = Never/g' "$PACCONF"
          sed -i 's/LocalFileSigLevel.*/LocalFileSigLevel = Never/g' "$PACCONF"

          # 2. Keyring initialisieren
          dkp-pacman-key --init || true
          dkp-pacman-key --populate devkitpro || true

          # 3. Pacman-Datenbanken synchronisieren
          dkp-pacman -Sy --noconfirm --config "$PACCONF" || true

          # 4. libctru, 3ds-dev und alle benötigten Bibliotheken installieren
          dkp-pacman -S --noconfirm libctru 3ds-dev 3ds-curl 3ds-mbedtls 3ds-libpng 3dstools tex3ds
      - name: Build App
        run: |
          make cia

      - name: Upload Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: FoxWebChat
          path: |
            *.cia
            *.3dsx
            build/*.cia
            build/*.3dsx
