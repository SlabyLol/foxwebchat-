<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoxWebChat</title>
<link rel="icon" type="image/png" href="resources/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-page: #180f0d;
    --bg-card: rgba(36, 26, 23, 0.72);
    --bg-card-alt: #2c211d;
    --orange: #f77f33;
    --orange-dark: #e15a23;
    --orange-glow: rgba(247, 127, 51, 0.35);
    --cream: #fff7f0;
    --muted: #b39285;
    --admin-red: #e63c3c;
    --border: #3a2c26;
  }

  * { box-sizing: border-box; }

  @keyframes floatGlow {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(20px, -15px) scale(1.08); }
  }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.94); }
    to   { opacity: 1; transform: scale(1); }
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Poppins', Arial, sans-serif;
    background: var(--bg-page);
    color: var(--cream);
    margin: 0;
    padding: 24px 16px 60px;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  body::before, body::after {
    content: "";
    position: fixed;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    filter: blur(90px);
    z-index: 0;
    pointer-events: none;
    opacity: 0.35;
  }

  body::before {
    background: var(--orange);
    top: -160px;
    left: -140px;
    animation: floatGlow 14s ease-in-out infinite;
  }

  body::after {
    background: #7a3ea1;
    bottom: -180px;
    right: -160px;
    animation: floatGlow 18s ease-in-out infinite reverse;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  /* ---- Theme palettes (mirroring the 3DS app's built-in themes) ---- */
  body[data-theme="blue"]     { --orange:#5850dc; --orange-dark:#3a32a8; --orange-glow:rgba(88,80,220,0.35); }
  body[data-theme="red"]      { --orange:#d23a28; --orange-dark:#a5261a; --orange-glow:rgba(210,58,40,0.35); }
  body[data-theme="dark"]     { --orange:#7a7a88; --orange-dark:#4a4a54; --orange-glow:rgba(122,122,136,0.35); }
  body[data-theme="forest"]   { --orange:#3c8c46; --orange-dark:#266932; --orange-glow:rgba(60,140,70,0.35); }
  body[data-theme="pastel"]   { --orange:#f096be; --orange-dark:#d76e9b; --orange-glow:rgba(240,150,190,0.35); }
  body[data-theme="sunshine"] { --orange:#fabe28; --orange-dark:#dc9b0a; --orange-glow:rgba(250,190,40,0.35); }
  body[data-theme="teal"]     { --orange:#23aaa5; --orange-dark:#147d78; --orange-glow:rgba(35,170,165,0.35); }
  body[data-theme="secret"]   { --orange:#d4af37; --orange-dark:#a3841f; --orange-glow:rgba(212,175,55,0.45); }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 22px;
    animation: fadeSlideIn 0.5s ease;
  }

  header .logo-wrap {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
    border-radius: 16px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 8px 24px var(--orange-glow);
    overflow: hidden;
  }

  header .logo { width: 56px; height: 56px; display: block; }

  header h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    background: linear-gradient(90deg, #ffffff 0%, #ffd9b8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header p {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--muted);
  }

  .theme-row {
    display: flex;
    gap: 6px;
    align-items: center;
    flex-wrap: wrap;
    max-width: 140px;
    justify-content: flex-end;
  }

  .theme-dot {
    width: 20px;
    height: 20px;
    border-radius: 50%;
    border: 2px solid rgba(255,255,255,0.15);
    cursor: pointer;
    padding: 0;
    transition: transform 0.15s ease, border-color 0.15s ease;
  }

  .theme-dot:hover { transform: scale(1.15); box-shadow: none; }
  .theme-dot.active { border-color: #ffffff; }

  .theme-dot.secret {
    background: linear-gradient(135deg, #d4af37, #fff3c4, #d4af37);
    animation: popIn 0.4s ease;
  }

  .card {
    background: var(--bg-card);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    animation: fadeSlideIn 0.5s ease;
  }

  .join-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  input {
    font-family: inherit;
    background: var(--bg-card-alt);
    border: 1px solid var(--border);
    color: var(--cream);
    padding: 11px 14px;
    border-radius: 10px;
    font-size: 14px;
    flex: 1;
    min-width: 140px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input:focus {
    outline: none;
    border-color: var(--orange);
    box-shadow: 0 0 0 3px var(--orange-glow);
  }

  input:disabled {
    opacity: 0.5;
  }

  button {
    font-family: inherit;
    font-weight: 600;
    font-size: 13px;
    border: none;
    border-radius: 10px;
    padding: 11px 20px;
    cursor: pointer;
    background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    color: white;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
  }

  button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px var(--orange-glow);
  }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  #chat {
    height: 420px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-right: 4px;
  }

  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

  .message {
    background: var(--bg-card-alt);
    border-radius: 14px;
    padding: 10px 12px;
    font-size: 14px;
    line-height: 1.45;
    display: flex;
    align-items: flex-start;
    gap: 10px;
    animation: popIn 0.25s ease;
    border: 1px solid transparent;
    transition: border-color 0.15s ease;
  }

  .message:hover { border-color: var(--border); }

  .message .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
    margin-top: 1px;
  }

  .message .content { flex: 1; min-width: 0; display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

  .message .body { flex: 1; min-width: 0; word-break: break-word; overflow-wrap: anywhere; white-space: normal; }

  .message .user { color: var(--orange); font-weight: 600; }

  .message.system {
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    justify-content: center;
    padding: 4px 0;
    animation: fadeSlideIn 0.3s ease;
  }

  .message.admin-text .user { color: var(--admin-red); }
  .message.admin-text { border-color: var(--admin-red); box-shadow: 0 0 0 1px var(--admin-red) inset; }

  .message.technoblade-msg {
    color: var(--admin-red);
    font-weight: 700;
    font-size: 13px;
  }

  .message button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 10px;
    font-size: 11px;
    flex-shrink: 0;
    box-shadow: none;
  }
  .message button:hover { border-color: var(--admin-red); color: var(--admin-red); background: transparent; transform: none; box-shadow: none; }

  .send-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }

  #adminPanel {
    display: none;
    border: 1px solid var(--admin-red);
  }

  #adminPanel h3 {
    color: var(--admin-red);
    margin: 0 0 12px;
    font-size: 16px;
  }

  #adminPanel h4 {
    margin: 18px 0 8px;
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  #adminPanel .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  #adminPanel .actions button { background: var(--admin-red); }
  #adminPanel .actions button:hover { background: #c92e2e; }

  .box {
    border: 1px solid var(--border);
    background: var(--bg-card-alt);
    border-radius: 12px;
    margin: 8px 0;
    padding: 10px 12px;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    animation: fadeSlideIn 0.3s ease;
  }

  .box b { color: var(--orange); }

  footer {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 24px;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <div class="logo-wrap">
      <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <rect x="0" y="0" width="100" height="100" rx="22" fill="#f77f33"/>
        <polygon points="27,15 15,45 42,35" fill="#ffffff"/>
        <polygon points="73,15 85,45 58,35" fill="#ffffff"/>
        <polygon points="30,20 22,40 39,34" fill="#e15a23"/>
        <polygon points="70,20 78,40 61,34" fill="#e15a23"/>
        <ellipse cx="50" cy="55" rx="29" ry="25" fill="#ffffff"/>
        <polygon points="40,52 60,52 50,72" fill="#f77f33"/>
        <circle cx="40" cy="49" r="4.5" fill="#3d211a"/>
        <circle cx="60" cy="49" r="4.5" fill="#3d211a"/>
      </svg>
    </div>
    <div style="flex:1;">
      <h1>FoxWebChat</h1>
      <p>Web Edition &middot; DarkFox Co.</p>
    </div>
    <div id="themeRow" class="theme-row"></div>
  </header>

  <div class="card">
    <div class="join-row">
      <input id="nameInput" placeholder="Enter name">
      <button id="joinBtn">Join</button>
    </div>
    <div id="joinError" style="display:none; color:var(--admin-red); font-size:12px; margin-top:8px;"></div>
  </div>

  <div class="card">
    <div id="chat"></div>
    <div class="send-row">
      <input id="msgInput" placeholder="Message..." disabled>
      <button id="sendBtn" disabled>Send</button>
    </div>
  </div>

  <div class="card" id="adminPanel">
    <h3>Admin Panel</h3>
    <div class="actions">
      <button id="clearChatBtn">Delete All Messages</button>
      <button id="clearReportsBtn">Delete All Reports</button>
    </div>

    <h4>Hardware-Ban a User</h4>
    <div class="join-row">
      <input id="banNameInput" placeholder="Username to hw-ban">
      <button id="banUserBtn" style="background:var(--admin-red);">Ban</button>
    </div>

    <h4>Reports</h4>
    <div id="reportList"></div>

    <h4>Kicked Users</h4>
    <div id="kickList"></div>
  </div>

  <footer>
    Unfair kick? Contact darkfox.tobias@outlook.com &middot;
    <a href="/makeYourOwnTheme/index.html/" style="color:var(--orange);">Build a 3DS theme</a>
  </footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, remove, set, onValue, get }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

/* ---------- FIREBASE CONFIG ---------- */
const firebaseConfig = {
  apiKey: "DEIN_API_KEY",
  authDomain: "foxwebchat-bd592.firebaseapp.com",
  databaseURL: "https://foxwebchat-bd592-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "foxwebchat-bd592",
  storageBucket: "foxwebchat-bd592.firebasestorage.app",
  messagingSenderId: "7129134893",
  appId: "1:7129134893:web:3a85e2fa031661c5a6c5a4"
};
/* ------------------------------------- */

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let username = "";

/* ---------- DEVICE ID (web equivalent of the 3DS hardware ID) ---------- */
function getDeviceId(){
  let id = localStorage.getItem("fwc_device_id");
  if(!id){
    id = Array.from(crypto.getRandomValues(new Uint8Array(8)))
      .map(b => b.toString(16).padStart(2, "0")).join("").toUpperCase();
    localStorage.setItem("fwc_device_id", id);
  }
  return id;
}
const deviceId = getDeviceId();

/* ---------- AVATAR COLOR HELPER ---------- */
function avatarColor(name){
  let hash = 0;
  for(let i = 0; i < name.length; i++){
    hash = name.charCodeAt(i) + ((hash << 5) - hash);
  }
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 62%, 48%)`;
}

/* ---------- THEMES (mirroring the 3DS app's built-in themes) ---------- */
const THEMES = [
  { id: "orange",   swatch: "#f77f33" },
  { id: "blue",     swatch: "#5850dc" },
  { id: "red",      swatch: "#d23a28" },
  { id: "dark",     swatch: "#7a7a88" },
  { id: "forest",   swatch: "#3c8c46" },
  { id: "pastel",   swatch: "#f096be" },
  { id: "sunshine", swatch: "#fabe28" },
  { id: "teal",     swatch: "#23aaa5" },
];
const SECRET_THEME_ID = "secret";
const SECRET_FLAG = "FWCT-SECRET-9f2c";

function applyTheme(id){
  document.body.setAttribute("data-theme", id === "orange" ? "" : id);
  localStorage.setItem("fwc_theme", id);
  renderThemeRow();
}

function renderThemeRow(){
  const row = document.getElementById("themeRow");
  row.innerHTML = "";
  const active = localStorage.getItem("fwc_theme") || "orange";

  THEMES.forEach(t => {
    const dot = document.createElement("button");
    dot.className = "theme-dot" + (t.id === active ? " active" : "");
    dot.style.background = t.swatch;
    dot.title = t.id;
    dot.onclick = () => applyTheme(t.id);
    row.appendChild(dot);
  });

  if(localStorage.getItem("fwc_secret") === SECRET_FLAG){
    const secretDot = document.createElement("button");
    secretDot.className = "theme-dot secret" + (active === SECRET_THEME_ID ? " active" : "");
    secretDot.title = "??? Secret Fox ???";
    secretDot.onclick = () => applyTheme(SECRET_THEME_ID);
    row.appendChild(secretDot);
  }
}

function unlockSecretTheme(){
  const alreadyUnlocked = localStorage.getItem("fwc_secret") === SECRET_FLAG;
  localStorage.setItem("fwc_secret", SECRET_FLAG);
  applyTheme(SECRET_THEME_ID);
  if(!alreadyUnlocked) showSecretToast();
}

function showSecretToast(){
  const toast = document.createElement("div");
  toast.style.cssText = `
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    background:linear-gradient(135deg,#d4af37,#a3841f); color:#1e140a;
    padding:14px 22px; border-radius:12px; font-weight:600; font-size:14px;
    box-shadow:0 10px 30px rgba(0,0,0,0.4); z-index:999; animation:popIn 0.3s ease;
  `;
  toast.textContent = "\u2728 You found a secret! \"Secret Fox\" theme unlocked \u2728";
  document.body.appendChild(toast);
  setTimeout(() => toast.remove(), 3000);
}

// Secret combo: hold Shift and press L (mirrors SELECT+L on the 3DS app)
document.addEventListener("keydown", (e) => {
  if(e.shiftKey && (e.key === "L" || e.key === "l")){
    unlockSecretTheme();
  }
});

applyTheme(localStorage.getItem("fwc_theme") || "orange");

let isAdmin = false;
const knownDeviceIds = {};
const TECHNOBLADE_JOIN_TEXT = "The Legend is here.... TECHNOBLADE JOINED";

function playTechnobladeSound(){
  try {
    const audio = new Audio("tnd.wav");
    audio.play().catch(() => {});
  } catch(e) {}
}

/* ---------- JOIN FUNCTION ---------- */
async function joinChat() {
  if(username) return; // Already joined

  const errorBox = document.getElementById("joinError");
  errorBox.style.display = "none";

  const enteredName = document.getElementById("nameInput").value.trim();
  if(!enteredName) return alert("Please enter a name");

  const joinBtn = document.getElementById("joinBtn");
  joinBtn.disabled = true;

  // Hardware-ID ban check: blocks joining outright, regardless of name chosen.
  try {
    const hidSnap = await get(ref(db, "hidbans/"+deviceId));
    if(hidSnap.exists()){
      showKickScreen(hidSnap.val().reason || "This device is banned");
      return;
    }
  } catch(e) {
    // offline etc. - fall through and let the normal onValue watcher catch it later
  }

  // Admin codes live in Firebase under "admins": code -> display name.
  let adminEntries = [];
  try {
    const snap = await get(ref(db, "admins"));
    if(snap.exists()){
      adminEntries = Object.entries(snap.val());
    }
  } catch(e) {
    // If this fails (offline etc.), just proceed as if there are no admin codes
  }

  const lowerEntered = enteredName.toLowerCase();
  let matchedAdminName = null;
  for(const [code, name] of adminEntries){
    if(enteredName === code){ matchedAdminName = name; break; }
  }

  let isReserved = false;
  if(!matchedAdminName){
    if(lowerEntered === "admin"){
      isReserved = true;
    } else {
      for(const [, name] of adminEntries){
        if(lowerEntered === String(name).toLowerCase()){ isReserved = true; break; }
      }
    }
  }

  if(matchedAdminName){
    isAdmin = true;
    username = matchedAdminName;
    document.getElementById("adminPanel").style.display = "block";
    push(ref(db,"messages"), {user:"System", text:username + " JOINED!"});
  } else if(isReserved){
    joinBtn.disabled = false;
    errorBox.textContent = "That name is reserved. Please choose another.";
    errorBox.style.display = "block";
    return;
  } else if(lowerEntered === "technoblade"){
    username = "Technoblade";
    push(ref(db,"messages"), {user:"System", text:TECHNOBLADE_JOIN_TEXT});
    playTechnobladeSound();
  } else {
    username = enteredName;
    push(ref(db,"messages"), {user:"System", text:username + " joined"});
  }

  document.getElementById("nameInput").disabled = true;
  document.getElementById("msgInput").disabled = false;
  document.getElementById("sendBtn").disabled = false;
  document.getElementById("msgInput").focus();

  watchKickStatus();
}

document.getElementById("joinBtn").addEventListener("click", joinChat);
document.getElementById("nameInput").addEventListener("keypress", (e) => {
  if(e.key === "Enter") joinChat();
});

/* ---------- SEND MESSAGE FUNCTION ---------- */
function sendMessage() {
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if(!text) return;

  push(ref(db,"messages"), {user:username, text:text, deviceId:deviceId});
  input.value = "";
  input.focus();
}

document.getElementById("sendBtn").addEventListener("click", sendMessage);
document.getElementById("msgInput").addEventListener("keypress", (e) => {
  if(e.key === "Enter") sendMessage();
});

/* ---------- LIVE CHAT ---------- */
onChildAdded(ref(db,"messages"), snap => {
  const data = snap.val();
  const messageId = snap.key;

  if(data.user && data.user !== "System" && data.deviceId){
    knownDeviceIds[data.user] = data.deviceId;
  }

  const div = document.createElement("div");
  div.className = "message";
  if(data.user === "System") div.classList.add("system");
  if(data.user === "ADMIN") div.classList.add("admin-text");
  if(data.user === "System" && data.text === TECHNOBLADE_JOIN_TEXT) div.classList.add("technoblade-msg");

  if(data.user !== "System"){
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = data.user.charAt(0).toUpperCase();
    avatar.style.background = avatarColor(data.user);
    div.appendChild(avatar);
  }

  const content = document.createElement("div");
  content.className = "content";

  const body = document.createElement("div");
  body.className = "body";
  if(data.user === "System"){
    body.textContent = data.text;
  } else {
    const userSpan = document.createElement("span");
    userSpan.className = "user";
    userSpan.textContent = data.user + ": ";
    body.appendChild(userSpan);
    body.appendChild(document.createTextNode(data.text));
  }
  content.appendChild(body);
  div.appendChild(content);

  /* ---------- REPORT BUTTON WITH SHAME MECHANIC ---------- */
  if(data.user !== "System"){

    if(!isAdmin && data.user === "ADMIN"){
      const reportBtn = document.createElement("button");
      reportBtn.textContent = "Report";

      reportBtn.onclick = () => {
        const confirmReport = window.confirm("Are you sure you want to report the Admin?");
        if(!confirmReport) return;

        push(ref(db,"messages"), {
          user:"System",
          text: username + " reported an Admin! What a shame!"
        });

        push(ref(db,"reports"), {
          reportedUser: username,
          messageText: "Tried to report ADMIN",
          reason: "Attempted to report Admin",
          reporter: username,
          deviceId: deviceId
        });

        set(ref(db,"kicks/"+username), { reason:"Attempted to report Admin" });
        set(ref(db,"hidbans/"+deviceId), { reason:"Attempted to report Admin", bannedName:username });
      };

      div.appendChild(reportBtn);

    } else {
      const reportBtn = document.createElement("button");
      reportBtn.textContent = "Report";

      reportBtn.onclick = () => {
        const reason = prompt("Report reason:");
        if(!reason) return;

        push(ref(db,"reports"), {
          reportedUser: data.user,
          messageText: data.text,
          messageId: messageId,
          reason: reason,
          reporter: username,
          deviceId: data.deviceId || ""
        });
      };

      div.appendChild(reportBtn);
    }
  }

  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
});

/* ---------- ADMIN PANEL: REPORTS ---------- */
onChildAdded(ref(db,"reports"), snap => {
  if(!isAdmin) return;

  const data = snap.val();
  const box = document.createElement("div");
  box.className = "box";

  const info = document.createElement("div");
  info.innerHTML =
    "<b>User:</b> " + data.reportedUser + "<br>" +
    "<b>Message:</b> " + data.messageText + "<br>" +
    "<b>Reason:</b> " + data.reason + "<br>" +
    "<b>Reported by:</b> " + data.reporter;
  box.appendChild(info);

  const kickBtn = document.createElement("button");
  kickBtn.textContent = "Kick";

  kickBtn.onclick = () => {
    set(ref(db,"kicks/"+data.reportedUser), { reason:data.reason });
    push(ref(db,"messages"), { user:"System", text:data.reportedUser + " got kicked. Reason: "+data.reason });
    box.remove();
  };

  box.appendChild(kickBtn);
  document.getElementById("reportList").appendChild(box);
});

/* ---------- ADMIN PANEL: KICK LIST WITH DELETE DATA ---------- */
onChildAdded(ref(db,"kicks"), snap => {
  if(!isAdmin) return;

  const user = snap.key;
  const data = snap.val();

  const div = document.createElement("div");
  div.className = "box";

  const info = document.createElement("div");
  info.innerHTML = "<b>" + user + "</b> &middot; Reason: " + data.reason;
  div.appendChild(info);

  const deleteBtn = document.createElement("button");
  deleteBtn.textContent = "Delete Data";

  deleteBtn.onclick = async () => {
    const messagesRef = ref(db,"messages");
    onChildAdded(messagesRef, msgSnap => {
      const msgData = msgSnap.val();
      if(msgData.user === user) remove(ref(db,"messages/"+msgSnap.key));
    });

    const reportsRef = ref(db,"reports");
    onChildAdded(reportsRef, repSnap => {
      const repData = repSnap.val();
      if(repData.reportedUser === user) remove(ref(db,"reports/"+repSnap.key));
    });

    remove(ref(db,"kicks/"+user));
    div.remove();
  };

  div.appendChild(deleteBtn);
  document.getElementById("kickList").appendChild(div);
});

/* ---------- DELETE ALL ---------- */
document.getElementById("clearChatBtn").onclick = () => { if(isAdmin) remove(ref(db,"messages")); };
document.getElementById("clearReportsBtn").onclick = () => { if(isAdmin) remove(ref(db,"reports")); };

/* ---------- MANUAL HARDWARE BAN ---------- */
document.getElementById("banUserBtn").onclick = () => {
  if(!isAdmin) return;
  const input = document.getElementById("banNameInput");
  const name = input.value.trim();
  if(!name) return;

  const knownId = knownDeviceIds[name];
  if(!knownId){
    push(ref(db,"messages"), { user:"System", text:"No known device ID for " + name + " - cannot hardware-ban." });
    input.value = "";
    return;
  }

  set(ref(db,"hidbans/"+knownId), { reason:"Banned by Admin", bannedName:name });
  push(ref(db,"messages"), { user:"System", text:name + "'s device was hardware-banned by an Admin." });
  input.value = "";
};
document.getElementById("banNameInput").addEventListener("keypress", (e) => {
  if(e.key === "Enter") document.getElementById("banUserBtn").click();
});

/* ---------- WATCH KICK STATUS ---------- */
function watchKickStatus(){
  const kickRef = ref(db,"kicks/"+username);
  onValue(kickRef, snap => {
    if(snap.exists()) showKickScreen(snap.val().reason);
  });

  const hidRef = ref(db,"hidbans/"+deviceId);
  onValue(hidRef, snap => {
    if(snap.exists()) showKickScreen(snap.val().reason || "This device is banned");
  });
}

/* ---------- KICK SCREEN ---------- */
function showKickScreen(reason){
  document.body.innerHTML = `
  <div style="
    background:#1a1210;
    color:#e63c3c;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-family:'Poppins', Arial, sans-serif;
    text-align:center;
    padding:20px;
  ">
    <h1>Oops! You got kicked by an Admin!</h1>
    <p style="color:#fff7f0;">Reason: ${reason}</p>
  </div>
  `;
}
</script>
