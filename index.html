<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FoxWebChat</title>
<link rel="icon" type="image/png" href="resources/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>
  :root {
    --bg-page: #180f0d;
    --bg-card: rgba(36, 26, 23, 0.72);
    --bg-card-alt: #2c211d;
    --orange: #f77f33;
    --orange-dark: #e15a23;
    --orange-glow: rgba(247, 127, 51, 0.35);
    --cream: #fff7f0;
    --muted: #b39285;
    --admin-red: #e63c3c;
    --border: #3a2c26;
  }

  * { box-sizing: border-box; }

  @keyframes floatGlow {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50% { transform: translate(20px, -15px) scale(1.08); }
  }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(8px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  @keyframes popIn {
    from { opacity: 0; transform: scale(0.94); }
    to   { opacity: 1; transform: scale(1); }
  }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Poppins', Arial, sans-serif;
    background: var(--bg-page);
    color: var(--cream);
    margin: 0;
    padding: 24px 16px 60px;
    min-height: 100vh;
    position: relative;
    overflow-x: hidden;
  }

  body::before, body::after {
    content: "";
    position: fixed;
    width: 480px;
    height: 480px;
    border-radius: 50%;
    filter: blur(90px);
    z-index: 0;
    pointer-events: none;
    opacity: 0.35;
  }

  body::before {
    background: var(--orange);
    top: -160px;
    left: -140px;
    animation: floatGlow 14s ease-in-out infinite;
  }

  body::after {
    background: #7a3ea1;
    bottom: -180px;
    right: -160px;
    animation: floatGlow 18s ease-in-out infinite reverse;
  }

  .wrap {
    max-width: 720px;
    margin: 0 auto;
    position: relative;
    z-index: 1;
  }

  header {
    display: flex;
    align-items: center;
    gap: 16px;
    margin-bottom: 22px;
    animation: fadeSlideIn 0.5s ease;
  }

  header .logo-wrap {
    width: 56px;
    height: 56px;
    flex-shrink: 0;
    border-radius: 16px;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.06), 0 8px 24px var(--orange-glow);
  }

  header .logo { width: 56px; height: 56px; display: block; }

  header h1 {
    margin: 0;
    font-size: 26px;
    font-weight: 700;
    background: linear-gradient(90deg, #ffffff 0%, #ffd9b8 100%);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  header p {
    margin: 2px 0 0;
    font-size: 13px;
    color: var(--muted);
  }

  .card {
    background: var(--bg-card);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px;
    margin-bottom: 16px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    animation: fadeSlideIn 0.5s ease;
  }

  .join-row {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
  }

  input {
    font-family: inherit;
    background: var(--bg-card-alt);
    border: 1px solid var(--border);
    color: var(--cream);
    padding: 11px 14px;
    border-radius: 10px;
    font-size: 14px;
    flex: 1;
    min-width: 140px;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }

  input:focus {
    outline: none;
    border-color: var(--orange);
    box-shadow: 0 0 0 3px var(--orange-glow);
  }

  input:disabled {
    opacity: 0.5;
  }

  button {
    font-family: inherit;
    font-weight: 600;
    font-size: 13px;
    border: none;
    border-radius: 10px;
    padding: 11px 20px;
    cursor: pointer;
    background: linear-gradient(135deg, var(--orange), var(--orange-dark));
    color: white;
    transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.15s ease;
  }

  button:hover:not(:disabled) {
    transform: translateY(-1px);
    box-shadow: 0 6px 16px var(--orange-glow);
  }
  button:active:not(:disabled) { transform: translateY(0); }
  button:disabled { opacity: 0.4; cursor: not-allowed; }

  #chat {
    height: 420px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 8px;
    padding-right: 4px;
  }

  #chat::-webkit-scrollbar { width: 8px; }
  #chat::-webkit-scrollbar-thumb { background: var(--border); border-radius: 8px; }

  .message {
    background: var(--bg-card-alt);
    border-radius: 14px;
    padding: 10px 12px;
    font-size: 14px;
    line-height: 1.45;
    display: flex;
    align-items: center;
    gap: 10px;
    animation: popIn 0.25s ease;
    border: 1px solid transparent;
    transition: border-color 0.15s ease;
  }

  .message:hover { border-color: var(--border); }

  .message .avatar {
    width: 30px;
    height: 30px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: white;
    flex-shrink: 0;
  }

  .message .content { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; }

  .message .body { flex: 1; min-width: 0; word-break: break-word; }

  .message .user { color: var(--orange); font-weight: 600; }

  .message.system {
    background: transparent;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
    justify-content: center;
    padding: 4px 0;
    animation: fadeSlideIn 0.3s ease;
  }

  .message.admin-text .user { color: var(--admin-red); }
  .message.admin-text { border-color: var(--admin-red); box-shadow: 0 0 0 1px var(--admin-red) inset; }

  .message button {
    background: transparent;
    border: 1px solid var(--border);
    color: var(--muted);
    padding: 5px 10px;
    font-size: 11px;
    flex-shrink: 0;
    box-shadow: none;
  }
  .message button:hover { border-color: var(--admin-red); color: var(--admin-red); background: transparent; transform: none; box-shadow: none; }

  .send-row {
    display: flex;
    gap: 10px;
    margin-top: 14px;
  }

  #adminPanel {
    display: none;
    border: 1px solid var(--admin-red);
  }

  #adminPanel h3 {
    color: var(--admin-red);
    margin: 0 0 12px;
    font-size: 16px;
  }

  #adminPanel h4 {
    margin: 18px 0 8px;
    font-size: 13px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  #adminPanel .actions { display: flex; gap: 10px; flex-wrap: wrap; }
  #adminPanel .actions button { background: var(--admin-red); }
  #adminPanel .actions button:hover { background: #c92e2e; }

  .box {
    border: 1px solid var(--border);
    background: var(--bg-card-alt);
    border-radius: 12px;
    margin: 8px 0;
    padding: 10px 12px;
    font-size: 13px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    flex-wrap: wrap;
    animation: fadeSlideIn 0.3s ease;
  }

  .box b { color: var(--orange); }

  footer {
    text-align: center;
    font-size: 12px;
    color: var(--muted);
    margin-top: 24px;
  }
</style>
</head>
<body>

<div class="wrap">
  <header>
    <svg class="logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <rect x="0" y="0" width="100" height="100" rx="22" fill="#f77f33"/>
      <polygon points="27,15 15,45 42,35" fill="#ffffff"/>
      <polygon points="73,15 85,45 58,35" fill="#ffffff"/>
      <polygon points="30,20 22,40 39,34" fill="#e15a23"/>
      <polygon points="70,20 78,40 61,34" fill="#e15a23"/>
      <ellipse cx="50" cy="55" rx="29" ry="25" fill="#ffffff"/>
      <polygon points="40,52 60,52 50,72" fill="#f77f33"/>
      <circle cx="40" cy="49" r="4.5" fill="#3d211a"/>
      <circle cx="60" cy="49" r="4.5" fill="#3d211a"/>
    </svg>
    <div>
      <h1>FoxWebChat</h1>
      <p>Web Edition &middot; DarkFox Co.</p>
    </div>
  </header>

  <div class="card">
    <div class="join-row">
      <input id="nameInput" placeholder="Enter name">
      <button id="joinBtn">Join</button>
    </div>
  </div>

  <div class="card">
    <div id="chat"></div>
    <div class="send-row">
      <input id="msgInput" placeholder="Message..." disabled>
      <button id="sendBtn" disabled>Send</button>
    </div>
  </div>

  <div class="card" id="adminPanel">
    <h3>Admin Panel</h3>
    <div class="actions">
      <button id="clearChatBtn">Delete All Messages</button>
      <button id="clearReportsBtn">Delete All Reports</button>
    </div>

    <h4>Reports</h4>
    <div id="reportList"></div>

    <h4>Kicked Users</h4>
    <div id="kickList"></div>
  </div>

  <footer>
    Unfair kick? Contact darkfox.tobias@outlook.com &middot;
    <a href="theme-creator.html" style="color:var(--orange);">Build a 3DS theme</a>
  </footer>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
import { getDatabase, ref, push, onChildAdded, remove, set, onValue }
from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

/* ---------- FIREBASE CONFIG ---------- */
const firebaseConfig = {
  apiKey: "DEIN_API_KEY",
  authDomain: "foxwebchat-bd592.firebaseapp.com",
  databaseURL: "https://foxwebchat-bd592-default-rtdb.europe-west1.firebasedatabase.app",
  projectId: "foxwebchat-bd592",
  storageBucket: "foxwebchat-bd592.firebasestorage.app",
  messagingSenderId: "7129134893",
  appId: "1:7129134893:web:3a85e2fa031661c5a6c5a4"
};
/* ------------------------------------- */

const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

let username = "";

/* ---------- AVATAR COLOR HELPER ---------- */
function avatarColor(name){
  let hash = 0;
  for(let i = 0; i < name.length; i++){
    hash = name.charCodeAt(i) + ((hash << 5) - hash);
  }
  const hue = Math.abs(hash) % 360;
  return `hsl(${hue}, 62%, 48%)`;
}

let isAdmin = false;
const ADMIN_CODE = "AdminJs93€=no";

/* ---------- JOIN FUNCTION ---------- */
function joinChat() {
  if(username) return; // Already joined

  username = document.getElementById("nameInput").value.trim();
  if(!username) return alert("Please enter a name");

  if(username === ADMIN_CODE){
    isAdmin = true;
    username = "ADMIN";
    document.getElementById("adminPanel").style.display = "block";
    push(ref(db,"messages"), {user:"System", text:"ADMIN JOINED - WARNING!"});
  } else {
    push(ref(db,"messages"), {user:"System", text:username + " joined"});
  }

  document.getElementById("nameInput").disabled = true;
  document.getElementById("joinBtn").disabled = true;
  document.getElementById("msgInput").disabled = false;
  document.getElementById("sendBtn").disabled = false;
  document.getElementById("msgInput").focus();

  watchKickStatus();
}

document.getElementById("joinBtn").addEventListener("click", joinChat);
document.getElementById("nameInput").addEventListener("keypress", (e) => {
  if(e.key === "Enter") joinChat();
});

/* ---------- SEND MESSAGE FUNCTION ---------- */
function sendMessage() {
  const input = document.getElementById("msgInput");
  const text = input.value.trim();
  if(!text) return;

  push(ref(db,"messages"), {user:username, text:text});
  input.value = "";
  input.focus();
}

document.getElementById("sendBtn").addEventListener("click", sendMessage);
document.getElementById("msgInput").addEventListener("keypress", (e) => {
  if(e.key === "Enter") sendMessage();
});

/* ---------- LIVE CHAT ---------- */
onChildAdded(ref(db,"messages"), snap => {
  const data = snap.val();
  const messageId = snap.key;

  const div = document.createElement("div");
  div.className = "message";
  if(data.user === "System") div.classList.add("system");
  if(data.user === "ADMIN") div.classList.add("admin-text");

  if(data.user !== "System"){
    const avatar = document.createElement("div");
    avatar.className = "avatar";
    avatar.textContent = data.user.charAt(0).toUpperCase();
    avatar.style.background = avatarColor(data.user);
    div.appendChild(avatar);
  }

  const content = document.createElement("div");
  content.className = "content";

  const body = document.createElement("div");
  body.className = "body";
  if(data.user === "System"){
    body.textContent = data.text;
  } else {
    const userSpan = document.createElement("span");
    userSpan.className = "user";
    userSpan.textContent = data.user + ": ";
    body.appendChild(userSpan);
    body.appendChild(document.createTextNode(data.text));
  }
  content.appendChild(body);
  div.appendChild(content);

  /* ---------- REPORT BUTTON WITH SHAME MECHANIC ---------- */
  if(data.user !== "System"){

    if(!isAdmin && data.user === "ADMIN"){
      const reportBtn = document.createElement("button");
      reportBtn.textContent = "Report";

      reportBtn.onclick = () => {
        const confirmReport = window.confirm("Are you sure you want to report the Admin?");
        if(!confirmReport) return;

        push(ref(db,"messages"), {
          user:"System",
          text: username + " reported an Admin! What a shame!"
        });

        push(ref(db,"reports"), {
          reportedUser: username,
          messageText: "Tried to report ADMIN",
          reason: "Attempted to report Admin",
          reporter: username
        });

        set(ref(db,"kicks/"+username), { reason:"Attempted to report Admin" });
      };

      div.appendChild(reportBtn);

    } else {
      const reportBtn = document.createElement("button");
      reportBtn.textContent = "Report";

      reportBtn.onclick = () => {
        const reason = prompt("Report reason:");
        if(!reason) return;

        push(ref(db,"reports"), {
          reportedUser: data.user,
          messageText: data.text,
          messageId: messageId,
          reason: reason,
          reporter: username
        });
      };

      div.appendChild(reportBtn);
    }
  }

  document.getElementById("chat").appendChild(div);
  document.getElementById("chat").scrollTop = document.getElementById("chat").scrollHeight;
});

/* ---------- ADMIN PANEL: REPORTS ---------- */
onChildAdded(ref(db,"reports"), snap => {
  if(!isAdmin) return;

  const data = snap.val();
  const box = document.createElement("div");
  box.className = "box";

  const info = document.createElement("div");
  info.innerHTML =
    "<b>User:</b> " + data.reportedUser + "<br>" +
    "<b>Message:</b> " + data.messageText + "<br>" +
    "<b>Reason:</b> " + data.reason + "<br>" +
    "<b>Reported by:</b> " + data.reporter;
  box.appendChild(info);

  const kickBtn = document.createElement("button");
  kickBtn.textContent = "Kick";

  kickBtn.onclick = () => {
    set(ref(db,"kicks/"+data.reportedUser), { reason:data.reason });
    push(ref(db,"messages"), { user:"System", text:data.reportedUser + " got kicked. Reason: "+data.reason });
    box.remove();
  };

  box.appendChild(kickBtn);
  document.getElementById("reportList").appendChild(box);
});

/* ---------- ADMIN PANEL: KICK LIST WITH DELETE DATA ---------- */
onChildAdded(ref(db,"kicks"), snap => {
  if(!isAdmin) return;

  const user = snap.key;
  const data = snap.val();

  const div = document.createElement("div");
  div.className = "box";

  const info = document.createElement("div");
  info.innerHTML = "<b>" + user + "</b> &middot; Reason: " + data.reason;
  div.appendChild(info);

  const deleteBtn = document.createElement("button");
  deleteBtn.textContent = "Delete Data";

  deleteBtn.onclick = async () => {
    const messagesRef = ref(db,"messages");
    onChildAdded(messagesRef, msgSnap => {
      const msgData = msgSnap.val();
      if(msgData.user === user) remove(ref(db,"messages/"+msgSnap.key));
    });

    const reportsRef = ref(db,"reports");
    onChildAdded(reportsRef, repSnap => {
      const repData = repSnap.val();
      if(repData.reportedUser === user) remove(ref(db,"reports/"+repSnap.key));
    });

    remove(ref(db,"kicks/"+user));
    div.remove();
  };

  div.appendChild(deleteBtn);
  document.getElementById("kickList").appendChild(div);
});

/* ---------- DELETE ALL ---------- */
document.getElementById("clearChatBtn").onclick = () => { if(isAdmin) remove(ref(db,"messages")); };
document.getElementById("clearReportsBtn").onclick = () => { if(isAdmin) remove(ref(db,"reports")); };

/* ---------- WATCH KICK STATUS ---------- */
function watchKickStatus(){
  const kickRef = ref(db,"kicks/"+username);
  onValue(kickRef, snap => {
    if(snap.exists()) showKickScreen(snap.val().reason);
  });
}

/* ---------- KICK SCREEN ---------- */
function showKickScreen(reason){
  document.body.innerHTML = `
  <div style="
    background:#1a1210;
    color:#e63c3c;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    flex-direction:column;
    font-family:'Poppins', Arial, sans-serif;
    text-align:center;
    padding:20px;
  ">
    <h1>Oops! You got kicked by an Admin!</h1>
    <p style="color:#fff7f0;">Reason: ${reason}</p>
  </div>
  `;
}
</script>

</body>
</html>
